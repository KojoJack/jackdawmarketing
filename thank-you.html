<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){
    try{
      var stored = localStorage.getItem("jackdaw-theme");
      var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    }catch(e){}
  })();
</script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7NPP9DSENG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7NPP9DSENG');
</script>
<title>Message sent: Jackdaw Marketing</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#221024">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#221024;
    --plum-3:#3A1C3E;
    --cream:#FCF3E3;
    --marigold:#FFC24B;
    --tomato:#FF5535;
    --display:'Archivo Black','Arial Black',Impact,sans-serif;
    --body:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  :root[data-theme="light"]{
    --plum:#FCF3E3;
    --plum-3:#E6CE9C;
    --cream:#221024;
    --marigold:#946000;
    --tomato:#BC3616;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100%;
    background:var(--plum);color:var(--cream);
    font-family:var(--body);font-size:17px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(40px,8vw,80px) clamp(20px,5vw,72px);
    text-align:center;
  }
  ::selection{background:var(--tomato);color:var(--cream)}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:3px}

  .bird{
    display:block;width:150px;height:auto;margin:0 auto 36px;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    filter:drop-shadow(2px 0 0 var(--cream)) drop-shadow(-2px 0 0 var(--cream)) drop-shadow(0 2px 0 var(--cream)) drop-shadow(0 -2px 0 var(--cream));
  }
  .bird:hover{transform:rotate(6deg) scale(1.1)}
  @media(prefers-reduced-motion:reduce){ .bird{transition:none} }

  .label{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.62;display:block;margin-bottom:14px;
  }

  h1{
    font-family:var(--display);text-transform:uppercase;letter-spacing:-.02em;
    font-size:clamp(36px,7vw,80px);line-height:.95;margin-bottom:22px;
  }

  p{
    font-size:clamp(16px,1.8vw,19px);opacity:.78;max-width:36ch;margin-bottom:40px;
  }

  .btn{
    display:inline-block;text-decoration:none;
    padding:14px 22px;
    font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    border:2px solid var(--cream);color:var(--cream);
    transition:transform .16s ease,background .16s ease,color .16s ease,border-color .16s ease;
  }
  .btn:hover{
    background:var(--marigold);border-color:var(--marigold);color:var(--plum);
    transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--plum-3);
  }
</style>
</head>
<body>

  <img class="bird" src="/Images/bird-cream.png" alt="" aria-hidden="true">

  <span class="label">Message received</span>
  <h1>Thanks<br>I'll be in touch.</h1>
  <p>I reply within one business day. Looking forward to hearing more about your project.</p>
  <a href="/" class="btn">Back to home</a>

</body>
</html>
