<title>The Vault: JackDaw Marketing</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#221024;
    --plum-2:#2E1631;
    --plum-3:#3A1C3E;
    --cream:#FCF3E3;
    --marigold:#FFC24B;
    --jade:#29C39A;
    --tomato:#FF5535;

    --display:'Archivo Black','Arial Black',Impact,sans-serif;
    --body:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;

    --pad:clamp(20px,5vw,72px);
    --maxw:1240px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--plum);
    color:var(--cream);
    font-family:var(--body);
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit}
  ::selection{background:var(--tomato);color:var(--cream)}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:3px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
  .label{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.62;
  }

  /* ---------- top bar ---------- */
  .bar{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:14px var(--pad);
    transition:background .3s ease,backdrop-filter .3s ease,border-color .3s ease;
    border-bottom:1px solid transparent;
  }
  .bar.stuck{background:rgba(34,16,36,.82);backdrop-filter:blur(10px);border-bottom-color:var(--plum-3)}
  .mark svg{shape-rendering:crispEdges}
  .mark:hover{background:var(--marigold)}
  .mark{
    display:inline-grid;place-items:center;width:40px;height:40px;
    background:var(--tomato);color:var(--cream);
    text-decoration:none;transition:background .2s ease;
  }
  .bar nav{display:flex;align-items:center;gap:clamp(14px,2.4vw,30px)}
  .bar nav a{
    font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;
  }
  .bar nav a:hover{border-bottom-color:var(--marigold)}
  .bar nav a.current{border-bottom-color:var(--tomato)}
  .bar nav a.hire{
    border:2px solid var(--cream);border-bottom-width:2px;padding:7px 14px;
  }
  .bar nav a.hire:hover{background:var(--marigold);border-color:var(--marigold);color:var(--plum)}

  .menu-btn{
    display:none;align-items:center;
    background:none;border:2px solid var(--cream);color:var(--cream);
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    padding:10px 16px;cursor:pointer;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .menu-btn:hover{background:var(--marigold);border-color:var(--marigold);color:var(--plum)}

  @media(max-width:700px){
    .menu-btn{display:inline-flex}
    .bar nav{
      display:none;
      position:absolute;top:100%;left:0;right:0;
      flex-direction:column;align-items:stretch;gap:0;
      background:rgba(34,16,36,.97);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--plum-3);
      padding:6px var(--pad) 20px;
    }
    .bar nav.open{display:flex}
    .bar nav a{padding:14px 0;border-bottom:1px solid var(--plum-3)}
    .bar nav a.hire{margin-top:12px;text-align:center}
  }

  .btn{
    display:inline-block;text-decoration:none;padding:14px 22px;
    font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    border:2px solid var(--cream);background:none;color:var(--cream);cursor:pointer;
    transition:transform .16s ease,background .16s ease,color .16s ease,border-color .16s ease;
  }
  .btn:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--plum-3)}
  .btn.solid{background:var(--cream);color:var(--plum);border-color:var(--cream)}
  .btn.solid:hover{background:var(--marigold);border-color:var(--marigold)}

  /* ---------- lock screen ---------- */
  .lock{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:120px var(--pad) 60px;
  }
  .lock .icon{font-size:38px;margin-bottom:18px}
  .lock h1{
    font-family:var(--display);text-transform:uppercase;letter-spacing:-.02em;
    font-size:clamp(34px,6vw,60px);line-height:.98;margin:0 0 14px;
  }
  .lock p{font-size:16px;opacity:.72;max-width:44ch;margin:0 0 34px}
  .lock-form{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}
  .lock-form input{
    background:var(--cream);color:var(--plum);
    border:2px solid var(--plum);border-radius:0;
    font-family:var(--body);font-size:16px;line-height:1.4;
    padding:12px 14px;width:100%;box-sizing:border-box;text-align:center;letter-spacing:.08em;
    -webkit-appearance:none;appearance:none;
  }
  .lock-form input:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
  .lock-error{
    font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;color:var(--tomato);margin:0;
  }
  .lock-error[hidden]{display:none}

  /* ---------- unlocked preview ---------- */
  .preview{display:none;position:fixed;inset:0;flex-direction:column;background:var(--plum);z-index:40}
  .preview.on{display:flex}
  .preview-bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px var(--pad);border-bottom:1px solid var(--plum-3);
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  }
  .preview-bar .tag{opacity:.6}
  .preview-bar .exit{
    background:none;border:2px solid var(--cream);color:var(--cream);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .preview-bar .exit:hover{background:var(--marigold);border-color:var(--marigold);color:var(--plum)}
  .preview iframe{flex:1;width:100%;border:0;background:var(--cream)}

  /* ---------- footer ---------- */
  footer{padding:26px 0 34px;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;opacity:.55;text-transform:uppercase}
</style>
</head>
<body>

<header class="bar" id="bar">
  <a href="/" class="mark" aria-label="JackDaw Marketing, back to home"><svg viewBox="0 0 20 16" width="27" height="21.6" aria-hidden="true" focusable="false"><g fill="var(--cream)"><rect x="13" y="0" width="4" height="1"/><rect x="12" y="1" width="6" height="1"/><rect x="12" y="2" width="2" height="1"/><rect x="15" y="2" width="3" height="1"/><rect x="12" y="3" width="6" height="1"/><rect x="11" y="4" width="7" height="1"/><rect x="10" y="5" width="8" height="1"/><rect x="9" y="6" width="9" height="1"/><rect x="8" y="7" width="4" height="1"/><rect x="13" y="7" width="5" height="1"/><rect x="7" y="8" width="4" height="1"/><rect x="13" y="8" width="5" height="1"/><rect x="5" y="9" width="5" height="1"/><rect x="12" y="9" width="6" height="1"/><rect x="3" y="10" width="7" height="1"/><rect x="12" y="10" width="7" height="1"/><rect x="0" y="11" width="9" height="1"/><rect x="11" y="11" width="8" height="1"/><rect x="1" y="12" width="17" height="1"/><rect x="4" y="13" width="4" height="1"/><rect x="13" y="13" width="4" height="1"/><rect x="4" y="14" width="1" height="1"/><rect x="16" y="14" width="1" height="1"/><rect x="3" y="15" width="3" height="1"/><rect x="15" y="15" width="3" height="1"/></g><g fill="var(--plum)"><rect x="18" y="3" width="2" height="1"/><rect x="18" y="4" width="2" height="1"/></g></svg></a>
  <nav id="nav">
    <a href="/#work">Work</a>
    <a href="/pricing/">Pricing</a>
    <a href="/#about">About</a>
    <a href="/the-vault/" class="current">The Vault</a>
    <a href="/#contact" class="hire">Start a project</a>
  </nav>
  <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
</header>

<main>
  <section class="lock" id="lockView">
    <span class="icon" aria-hidden="true">🔒</span>
    <h1>The Vault</h1>
    <p>Password-protected client previews. If someone sent you a link and a password, you're in the right place.</p>
    <form class="lock-form" id="lockForm">
      <label class="label" for="lockPassword" style="margin-bottom:-4px">Password</label>
      <input type="text" id="lockPassword" name="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="submit" class="btn solid">Unlock</button>
      <p class="lock-error" id="lockError" hidden>That's not it, try again.</p>
    </form>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="foot-brand"><img src="/Images/bird-marigold.png" alt="" loading="lazy" style="width:15px;height:auto">JackDaw Marketing</span>
    <span>A bird that collects bright things</span>
    <span id="year"></span>
  </div>
</footer>

<div class="preview" id="previewView">
  <div class="preview-bar">
    <span class="tag">🔒 The Vault: Previewing <b id="previewLabel">EarCare Hearing Center</b></span>
    <button class="exit" id="exitBtn" type="button">Exit preview</button>
  </div>
  <iframe id="vaultFrame" title="Client site preview"></iframe>
</div>

<script>
document.getElementById("year").textContent = "© " + new Date().getFullYear();

const bar = document.getElementById("bar");
addEventListener("scroll", () => bar.classList.toggle("stuck", scrollY > 24), { passive:true });

/* ---------- mobile menu ---------- */
const nav = document.getElementById("nav");
const menuBtn = document.getElementById("menuBtn");
function closeMenu() {
  nav.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
  menuBtn.textContent = "Menu";
}
menuBtn.addEventListener("click", () => {
  const open = nav.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.textContent = open ? "Close" : "Menu";
});
nav.addEventListener("click", (e) => { if (e.target.closest("a")) closeMenu(); });
addEventListener("resize", () => { if (innerWidth > 700) closeMenu(); });

/* ---------- vault gate ----------
   Client-side only: good enough to keep this out of casual view and
   search engines, not a substitute for real server-side auth. */
const VAULTS = {
  earcare: { path: "earcare/", label: "EarCare Hearing Center" },
  pokemon: { path: "pokemon/", label: "Pokémon Card Binder" },
  bluesky: { path: "bluesky/", label: "BlueSky Home Renovations" }
};
const STORE_KEY = "jackdaw-vault-unlocked";

const lockView = document.getElementById("lockView");
const lockForm = document.getElementById("lockForm");
const lockPassword = document.getElementById("lockPassword");
const lockError = document.getElementById("lockError");
const previewView = document.getElementById("previewView");
const previewLabel = document.getElementById("previewLabel");
const vaultFrame = document.getElementById("vaultFrame");
const exitBtn = document.getElementById("exitBtn");

function unlock(key) {
  const v = VAULTS[key];
  if (!v) return;
  sessionStorage.setItem(STORE_KEY, key);
  bar.style.display = "none";
  lockView.style.display = "none";
  document.querySelector("footer").style.display = "none";
  previewLabel.textContent = v.label;
  vaultFrame.src = v.path;
  previewView.classList.add("on");
}

function relock() {
  sessionStorage.removeItem(STORE_KEY);
  vaultFrame.src = "about:blank";
  previewView.classList.remove("on");
  bar.style.display = "";
  lockView.style.display = "flex";
  document.querySelector("footer").style.display = "";
  lockPassword.value = "";
  lockError.hidden = true;
}

lockForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const key = lockPassword.value.trim().toLowerCase();
  if (VAULTS[key]) {
    unlock(key);
  } else {
    lockError.hidden = false;
    lockPassword.focus();
    lockPassword.select();
  }
});

exitBtn.addEventListener("click", relock);

// Every fresh visit starts locked, the password is required every time,
// not just remembered from a previous unlock in this tab.
sessionStorage.removeItem(STORE_KEY);
</script>
</body>
</html>
