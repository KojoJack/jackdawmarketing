<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Dex — card binder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Outfit:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap');

:root{--base:#12141F;--panel:#1A1D2B;--line:#2E3348;--text:#F0EBE0;--dim:#868CA6;--gold:#E8B14C}
*{box-sizing:border-box}
body{margin:0;background:
    radial-gradient(120% 80% at 15% -10%,#1E2237 0%,transparent 60%),
    radial-gradient(100% 70% at 100% 0%,#191B2C 0%,transparent 55%),
    var(--base) fixed;
  color:var(--text);font-family:'Outfit',system-ui,-apple-system,sans-serif;font-weight:300;
  padding:26px clamp(14px,3vw,34px) 40px;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}

/* header */
.head{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end;
  padding-bottom:18px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.title{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:6px}
.count{flex:0 1 330px;min-width:min(330px,100%)}
.count-n{font-family:'Space Mono',monospace;text-align:right;line-height:1}
.count-n b{font-size:34px;color:var(--gold)}
.count-n span{font-size:15px;color:var(--dim)}
.track{position:relative;padding-top:32px;margin-top:6px}
.bar{height:4px;background:#262A3D;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#B8863A,var(--gold));transition:width .55s cubic-bezier(.25,.9,.3,1)}
.pika{position:absolute;bottom:6px;width:36px;height:auto;transform:translateX(-50%);
  image-rendering:pixelated;filter:drop-shadow(0 3px 4px #000a);
  transition:left .55s cubic-bezier(.25,.9,.3,1);pointer-events:none}
.count-sub{font-size:11.5px;color:var(--dim);text-align:right;margin-top:7px}
.save{font-family:'Space Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;margin-left:8px;opacity:0;transition:opacity .25s}
.save.on{opacity:.75}
.save.err{opacity:1;color:#D9756A}

/* nav */
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:18px 0 22px}
.tab{font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:600;padding:7px 15px;border-radius:999px;color:var(--dim);transition:color .18s,background .18s}
.tab:hover{color:var(--text)}
.tab.on{background:#282D42;color:var(--text)}
.spacer{flex:1}
.chip{font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--dim);transition:all .16s}
.chip:hover{border-color:#3E445E;color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#15161F;font-weight:500}
.chip.type.on{background:var(--tc);border-color:var(--tc);color:#15161F}

/* search */
.searchwrap{position:relative;flex:0 1 268px;min-width:190px}
.search{width:100%;background:#1B1E2D;border:1px solid var(--line);border-radius:999px;padding:8px 15px;color:var(--text);font-family:inherit;font-size:13px;font-weight:300}
.search::placeholder{color:#5D6480}
.search:focus{outline:none;border-color:var(--gold)}
.sug{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;background:#1C2030;border:1px solid var(--line);
  border-radius:10px;padding:5px;box-shadow:0 22px 46px -18px #000;animation:sugin .14s ease-out;max-height:340px;overflow:auto}
@keyframes sugin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.sugrow{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;text-align:left}
.sugrow:hover,.sugrow.on{background:#282E45}
.sugrow img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated;flex:0 0 26px}
.sugrow .sn{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugrow .sm{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--dim);white-space:nowrap}
.sugrow .pip{width:7px;height:7px;border-radius:50%;background:#39405C;flex:0 0 7px}
.sugrow .pip.have{background:#7E8C5E}
.sugrow .pip.special{background:var(--gold)}
.sugnone{padding:9px 10px;font-size:12.5px;color:var(--dim)}
@keyframes flashring{0%,100%{box-shadow:none}25%,70%{box-shadow:0 0 0 2px var(--gold),0 0 24px -4px var(--gold)}}
.flash{animation:flashring 1.7s ease-in-out}

/* card menu */
#pop{position:fixed;z-index:60;display:none}
#pop.open{display:block}
#pop.anim{animation:popin .16s cubic-bezier(.2,.85,.3,1)}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.popcard{background:#1C2030;border:1px solid #383E58;border-radius:11px;padding:6px;min-width:190px;box-shadow:0 26px 54px -20px #000,0 0 0 1px #00000055}
.pophead{display:flex;align-items:center;gap:7px;padding:6px 9px 9px;border-bottom:1px solid #2B3048;margin-bottom:5px;font-size:13.5px}
.pophead em{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--dim);font-style:normal}
.poptypes{display:flex;gap:3px;margin-left:auto}
.poptypes i{width:8px;height:8px;border-radius:2px}
.popopt{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:6px;font-size:13px;text-align:left;transition:background .13s,color .13s;color:var(--dim)}
.popopt:hover{background:#282E45;color:var(--text)}
.popopt .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #4A5170;flex:0 0 8px;transition:all .13s}
.popopt.on{color:var(--text);font-weight:400}
.popopt.on .dot{border-color:var(--gold);background:var(--gold);box-shadow:0 0 8px -1px var(--gold)}
.popopt[data-opt="special"].on .dot{border-color:#E39EDC;background:linear-gradient(115deg,#6FE0D0,#8FB4FF,#E39EDC,#F0C75E);box-shadow:0 0 9px -1px #E39EDC}
.popopt[data-opt="off"].on .dot{border-color:#4A5170;background:transparent;box-shadow:none}

/* page nav */
.pagenav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
.arrow{font-size:26px;line-height:1;width:38px;height:38px;border-radius:50%;color:var(--dim);border:1px solid var(--line);transition:all .16s}
.arrow:hover:not(:disabled){color:var(--text);border-color:var(--gold)}
.arrow:disabled{opacity:.25;cursor:default}
.pagemeta{text-align:center;min-width:200px}
.pageno{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.02em}
.pagerange{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--dim);letter-spacing:.06em;margin-top:2px}
.strip{display:flex;gap:1px;align-items:flex-end;height:26px;margin:0 auto 26px;max-width:860px}
.sbar{flex:1;height:100%;position:relative;background:#1E2233;border-radius:1px;min-width:2px}
.sbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fill);background:#4A5170;border-radius:1px;transition:height .3s}
.sbar:hover::after{background:#666E92}
.sbar.full::after{background:#7E8C5E}
.sbar.on{background:#2C3247}
.sbar.on::after{background:var(--gold)}
.sbar.split{margin-left:9px}
.sbar.split::before{content:"";position:absolute;left:-5px;top:0;bottom:0;width:1px;background:#3B4260}

/* sheets */
.sheets{display:flex;flex-wrap:wrap;gap:clamp(14px,2.4vw,30px);justify-content:center;animation:turn .38s cubic-bezier(.2,.7,.3,1)}
@keyframes turn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.sheet{background:#20243469;border:1px solid var(--line);border-radius:10px;padding:clamp(9px,1.4vw,15px);flex:1 1 300px;max-width:460px;box-shadow:0 18px 40px -22px #000,inset 0 1px 0 #FFFFFF08}
.side{display:flex;align-items:baseline;gap:8px;font-family:'Space Mono',monospace;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.side b{font-size:11px;letter-spacing:.12em;color:var(--text);font-weight:700}
.side span{letter-spacing:.1em;margin-left:auto;text-transform:none;font-size:9.5px}
.sheet.ghost{background:none;border:1px dashed #22273A;box-shadow:none;opacity:.45}
@media (max-width:760px){.sheet.ghost{display:none}}

/* binder cover */
.cover{flex:1 1 300px;max-width:460px;border-radius:10px;padding:clamp(16px,2.4vw,26px);
  display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;
  border:1px solid #333A54;
  background:
    radial-gradient(72% 52% at 50% 26%, color-mix(in srgb,var(--accent) 26%, transparent) 0%, transparent 68%),
    linear-gradient(168deg,#252A3E 0%,#1A1E2E 62%,#171B29 100%);
  box-shadow:0 18px 40px -22px #000, inset 0 1px 0 #FFFFFF10}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(122deg,#FFFFFF12 0%,#FFFFFF04 24%,transparent 46%)}
.cover::before{content:"";position:absolute;inset:7px;border-radius:6px;pointer-events:none;
  border:1px solid #FFFFFF0E}
.cover-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
.ball{width:clamp(74px,19%,104px);height:auto;margin-bottom:clamp(12px,2.2vw,20px);
  filter:drop-shadow(0 10px 18px #0009);animation:bob 5.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.cover-kicker{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.28em;
  text-transform:uppercase;color:color-mix(in srgb,var(--accent) 55%,var(--dim))}
.cover-title{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(24px,4.4vw,34px);font-weight:800;
  letter-spacing:-.035em;line-height:1;margin-top:7px}
.cover-binder{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(12px,1.7vw,14px);font-weight:600;
  letter-spacing:.02em;color:var(--gold);margin-top:5px}
.cover-rule{width:38px;height:1px;background:#3B4260;margin:clamp(11px,2vw,16px) 0}
.cover-range{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--dim)}
.cover-bar{width:min(160px,72%);height:3px;background:#262B3E;border-radius:2px;overflow:hidden;margin-top:11px}
.cover-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#B8863A,var(--gold));transition:width .5s cubic-bezier(.25,.9,.3,1)}
.cover-count{font-size:11.5px;color:var(--dim);margin-top:8px}
.cover-count b{font-family:'Space Mono',monospace;color:var(--text);font-weight:700}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
.cover.endplate{background:
    radial-gradient(70% 50% at 50% 30%, color-mix(in srgb,var(--accent) 12%, transparent) 0%, transparent 70%),
    linear-gradient(168deg,#1E2232 0%,#181C2A 70%);
  border-style:dashed;border-color:#2C3248}
.ball.faded{animation:none;opacity:.9}
.endlink{margin-top:14px;font-size:12px;color:var(--gold);border:1px solid #4A4230;border-radius:999px;
  padding:6px 14px;transition:all .16s}
.endlink:hover{background:#2A2618;border-color:var(--gold)}
.endnote{margin-top:12px;font-size:12px;color:var(--dim);line-height:1.5;max-width:230px}
.endnote b{color:var(--gold);font-family:'Space Mono',monospace}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.1vw,11px)}

/* pocket */
.pocket{position:relative;aspect-ratio:5/7;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#1F2333,#191C2A);
  border:1px dashed #333852;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .16s,border-color .2s,box-shadow .25s}
.pocket:hover{transform:translateY(-2px);border-color:#414863;z-index:2}
.pocket.have{border:2px solid color-mix(in srgb,var(--glow) 60%,#171A27);
  background:radial-gradient(85% 65% at 50% 32%,color-mix(in srgb,var(--glow) 30%,transparent) 0%,transparent 70%),linear-gradient(165deg,#242939,#1B1F2D)}
.pocket.have:hover{box-shadow:0 0 0 1px var(--glow),0 12px 26px -14px var(--glow)}
.pocket.special{border:2px solid #6E5525}
.art{width:82%;max-height:70%;object-fit:contain;pointer-events:none;transition:filter .3s,opacity .3s}
.pocket:not(.have) .art{filter:brightness(0) invert(1);opacity:.11}
.pocket:not(.have):hover .art{opacity:.2}
.pocket.have .art{filter:drop-shadow(0 5px 10px #0009)}
.glyph{display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;
  font-size:clamp(15px,3.4vw,23px);letter-spacing:-.02em;line-height:1;color:#3B4160;transition:color .25s;min-height:34px}
.pocket.have .glyph{color:color-mix(in srgb,var(--glow) 78%,#FFF)}
.no{position:absolute;top:5px;left:6px;font-family:'Space Mono',monospace;font-size:8.5px;color:var(--dim);opacity:.7}
.pocket.special .no{color:var(--gold);opacity:1}
.nm{position:absolute;bottom:10px;left:0;right:0;font-size:10px;text-align:center;color:var(--dim);padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pocket.have .nm{color:var(--text)}
.tstripe{position:absolute;bottom:0;left:0;right:0;height:3px;display:flex;opacity:.35;transition:opacity .25s}
.pocket.have .tstripe{opacity:1}
.tstripe i{flex:1}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(128deg,#FFFFFF14 0%,#FFFFFF03 26%,transparent 47%)}
.pocket .hunt{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.foil{position:absolute;inset:0;pointer-events:none;padding:2px;background:linear-gradient(115deg,#6FE0D0,#8FB4FF,#E39EDC,#F0C75E,#6FE0D0);
  background-size:340% 340%;animation:foil 7s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
@keyframes foil{0%{background-position:0% 50%}100%{background-position:340% 50%}}

/* card art in the pocket — a card is 2.5x3.5, the same ratio as the 5/7 pocket, so it fills it.
   The scan is layered over the sprite and fades in on load, so the pocket never resizes
   and never goes blank while the image is on its way. */
.pocket.hascard{border-style:solid}
.cardart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;
  opacity:0;transition:opacity .3s ease-out;z-index:1}
.cardart.in{opacity:1}
.pocket.hascard .cardtag{position:absolute;left:0;right:0;bottom:0;padding:10px 5px 3px;font-size:8px;z-index:2;
  color:#E9E4D6;background:linear-gradient(transparent,#000000CC);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;opacity:0;transition:opacity .18s}
.pocket.hascard:hover .cardtag{opacity:1}
.pocket.hascard .hunt,.pocket.hascard .foil{z-index:3}
.pinfo{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;z-index:4;
  background:#0B0D16D9;border:1px solid #FFFFFF2E;color:#E9E4D6;
  font-family:'Space Mono',monospace;font-size:10px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transform:scale(.85);transition:opacity .16s,transform .16s,background .16s}
.pocket:hover .pinfo,.pinfo:focus-visible{opacity:1;transform:scale(1)}
.pinfo:hover{background:var(--gold);color:#15161F;border-color:var(--gold)}

/* picker */
#modal{display:none}
#modal.open{display:block}
.scrim{position:fixed;inset:0;background:#080A12CC;backdrop-filter:blur(3px);z-index:70;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheetbox{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(980px,94vw);max-height:88vh;display:flex;flex-direction:column;
  background:#181C2B;border:1px solid #363C56;border-radius:14px;overflow:hidden;
  box-shadow:0 40px 90px -30px #000;animation:rise .2s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #2B3048;flex:0 0 auto}
.mhead img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated}
.mhead .cno{font-family:'Space Mono',monospace;font-size:11px;color:#4E5679;width:38px;text-align:center}
.mtitle{display:flex;flex-direction:column;gap:2px}
.mtitle b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em}
.mtitle span{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.mclose{margin-left:auto;font-size:24px;line-height:1;width:34px;height:34px;border-radius:50%;color:var(--dim);
  border:1px solid var(--line);transition:all .15s}
.mclose:hover{color:var(--text);border-color:var(--gold)}
.mbody{overflow:auto;padding:16px;flex:1 1 auto}
.galbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.galbar .search{flex:1 1 200px;max-width:300px}
.galcount{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-left:auto}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.galgrid .yr{grid-column:1/-1;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--dim);
  margin:10px 0 0;padding-bottom:5px;border-bottom:1px solid var(--line)}
.gcard{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:9px;background:#20253A;
  border:1px solid #2C3248;transition:transform .14s,border-color .14s,box-shadow .2s;text-align:center}
.gcard:hover{transform:translateY(-2px);border-color:#4A5170;box-shadow:0 12px 24px -14px #000}
.gcard img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:5px;background:#171B29}
.gc-set{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-meta{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 26px -14px var(--gold)}
.galnote{padding:34px 10px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6}
.galnote.bad{color:var(--text)}
.galnote code{font-family:'Space Mono',monospace;font-size:11px;background:#22273A;padding:2px 6px;border-radius:3px}
.galnote p{font-size:12.5px;color:var(--dim);margin:10px 0 0}
.galnote .ghost{margin-top:12px}
.galpartial{background:#1E2233;border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:7px;
  padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--dim);line-height:1.5}
.galpartial .ghost{margin-left:8px}
.spin{display:inline-block;width:13px;height:13px;margin-right:9px;vertical-align:-2px;border-radius:50%;
  border:2px solid #333A54;border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* chosen card detail */
.detail{display:flex;flex-wrap:wrap;gap:22px}
.detail-art{flex:0 0 auto;width:min(260px,42%)}
.detail-art img{width:100%;border-radius:10px;box-shadow:0 20px 40px -18px #000}
.detail-info{flex:1 1 280px;min-width:260px}
.dt-name{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em}
.dt-set{font-size:13px;color:var(--gold);margin-top:3px}
.dt-meta{display:flex;flex-wrap:wrap;gap:18px;margin:16px 0;padding:13px 0;border-top:1px solid #2B3048;border-bottom:1px solid #2B3048}
.dt-meta dt{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.dt-meta dd{margin:3px 0 0;font-size:13px}
.dt-fields{display:flex;flex-wrap:wrap;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;flex:1 1 130px;margin-bottom:10px}
.fld span{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.fld input,.fld select{background:#1E2233;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
  color:var(--text);font-family:inherit;font-size:13px;font-weight:300;width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold)}
.dt-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ghost.danger{color:#C97A72;border-color:#4A3330}
.ghost.danger:hover{color:#E08C83;border-color:#6E4741}
.popsplit{height:1px;background:#2B3048;margin:5px 0}
.popopt.pick .dot.on{border-color:var(--gold);background:var(--gold);box-shadow:0 0 8px -1px var(--gold)}
.popopt.drop{color:#8A8FA8}
.popopt.drop:hover{color:#E08C83}

/* flip arrows either side of the spread */
.spread{display:flex;align-items:center;gap:clamp(2px,.6vw,8px);justify-content:center}
/* shrink-to-fit so the arrows sit beside the pages rather than out at the window edge */
.spread .sheets{flex:0 1 auto;min-width:0}
.flip{flex:0 0 auto;align-self:stretch;width:clamp(34px,4.5vw,54px);min-height:180px;
  border-radius:12px;border:1px solid transparent;color:#565D7E;font-size:30px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s,border-color .18s}
.flip span{display:block;transition:transform .18s}
.flip:hover:not(:disabled){background:#20243A;border-color:#39405C;color:var(--gold)}
.flip.left:hover:not(:disabled) span{transform:translateX(-3px)}
.flip.right:hover:not(:disabled) span{transform:translateX(3px)}
.flip:active:not(:disabled){background:#262B44}
.flip:disabled{opacity:.16;cursor:default}
@media (max-width:620px){.flip{width:30px;min-height:120px;font-size:24px}}

/* sets */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.setgrid .yr{grid-column:1/-1;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:var(--dim);margin:14px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.settile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 11px;
  background:#1E2233;border:1px solid #2C3248;border-radius:11px;text-align:center;
  transition:transform .14s,border-color .14s,box-shadow .2s}
.settile:hover{transform:translateY(-2px);border-color:#454D6C;box-shadow:0 14px 28px -16px #000}
.setlogo{height:56px;display:flex;align-items:center;justify-content:center;width:100%}
.setlogo img{max-height:56px;max-width:100%;object-fit:contain}
.setlogo em{font-style:normal;font-size:12px;color:var(--dim)}
.setname{font-size:12.5px;line-height:1.3}
.setmeta{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--dim);letter-spacing:.04em}
.setmine{font-size:9.5px;color:var(--gold);background:#2A2618;border-radius:999px;padding:2px 9px;margin-top:2px}
.setback{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sethead{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:16px 18px;margin-bottom:18px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px}
.sethero{max-height:66px;max-width:190px;object-fit:contain}
.sethead-name{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;
  letter-spacing:-.025em;text-transform:none;color:var(--text);margin:0}
.sethead-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:5px}
.sethead-mine{font-size:12.5px;color:var(--dim);margin-top:7px}
.sethead-mine b{color:var(--gold);font-family:'Space Mono',monospace}
.galgrid .gcard{position:relative}
.gcard.setcard{cursor:pointer}
.gcard.mine{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);background:#282C3C}
.gcard.mine img{filter:none;opacity:1}
.setcard:not(.mine) img{opacity:.45;filter:saturate(.55);transition:opacity .18s,filter .18s}
.setcard:not(.mine):hover img{opacity:.9;filter:saturate(1)}
.ownedtick{position:absolute;top:8px;right:8px;width:19px;height:19px;border-radius:50%;
  background:var(--gold);color:#15161F;font-size:11px;display:flex;align-items:center;justify-content:center;
  animation:tickin .18s cubic-bezier(.2,.9,.3,1)}
@keyframes tickin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.dexflag{position:absolute;top:8px;left:8px;font-family:'Space Mono',monospace;font-size:8px;
  background:#0B0D16D9;border:1px solid #FFFFFF26;color:var(--gold);border-radius:999px;padding:2px 6px}
.chaseflag{position:absolute;bottom:52px;left:8px;font-size:10px;color:#F0C75E;
  text-shadow:0 0 6px #000,0 0 10px #F0C75E80}
.gcard.chase{border-color:#5A4A22}
.gcard.chase.mine{border-color:var(--gold)}
.sethead-bar{height:4px;background:#262B3E;border-radius:2px;overflow:hidden;margin-top:8px;max-width:240px}
.sethead-bar i{display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,#B8863A,var(--gold));transition:width .4s}
.sethead-hint{font-size:11px;color:#5D6480;margin-top:9px;line-height:1.45;max-width:340px}

/* dex wall */
.filters{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.frow{display:flex;flex-wrap:wrap;gap:5px}
.wallcount{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px}
.cell{position:relative;aspect-ratio:1;min-height:46px;border-radius:5px;background:#20253C;border:1px solid #313853;
  display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;overflow:hidden}
/* the number is always in normal flow, so a cell can never collapse to no height,
   and the sprite is layered over it rather than replacing it */
.cell .cno{font-family:'Space Mono',monospace;font-size:12px;color:#4E5679;letter-spacing:-.03em}
.cell.have .cno{color:color-mix(in srgb,var(--tc) 55%,#9098B4)}
.cell img{position:absolute;top:6%;left:6%;width:88%;height:88%;object-fit:contain;image-rendering:pixelated}
.cell:not(.have) img{filter:brightness(0) invert(1);opacity:.22}
.cell:hover{background:#22273A;border-color:#3B4159}
.cell.have{background:#212637;border-color:color-mix(in srgb,var(--tc) 60%,transparent)}
.cell.special{border-color:var(--gold);box-shadow:inset 0 0 12px -4px var(--gold)}
.cell.wanted::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px -1px var(--gold)}
.cell .lbl{position:absolute;bottom:1px;left:0;right:0;font-size:7.5px;text-align:center;color:var(--dim);opacity:0;
  transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.cell:hover .lbl{opacity:.9}
.sentinel{height:40px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#4A5170}
.empty{padding:44px 0;text-align:center;color:var(--dim);font-size:14px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.wide{grid-column:1/-1}
.card h2{font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px}
ul.plain{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.near button{display:flex;align-items:center;gap:11px;width:100%;padding:7px 8px;border-radius:6px;transition:background .15s}
.near button:hover{background:#242940}
.near-p{font-family:'Space Mono',monospace;font-size:11px;min-width:62px;text-align:left}
.minibar{flex:1;height:5px;background:#262B3E;border-radius:3px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--gold)}
.near-n{font-size:11px;color:var(--dim);min-width:58px;text-align:right}
.row{display:flex;align-items:center;gap:10px}
.rl{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);min-width:34px}
.rv{font-family:'Space Mono',monospace;font-size:11px;min-width:62px;text-align:right}
.rv em{color:var(--dim);font-style:normal}
.tn{font-size:12px;min-width:66px}
.tv{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--dim);min-width:34px;text-align:right}
.facts{display:flex;flex-direction:column;gap:13px}
.facts div{display:flex;align-items:baseline;gap:11px}
.facts b{font-family:'Bricolage Grotesque',sans-serif;font-size:27px;font-weight:800;color:var(--gold);min-width:52px}
.facts span{font-size:12.5px;color:var(--dim);line-height:1.35}
.huntlist{display:flex;flex-wrap:wrap;gap:6px}
.hitem{display:flex;align-items:center;gap:6px;background:#232840;border-radius:999px;padding:4px 12px;font-size:12px}
.hitem img{width:24px;height:24px;image-rendering:pixelated;margin:-4px 0}
.hitem em{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--dim);font-style:normal}

/* recent */
.recent{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
.recent li{animation:slidein .3s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.recent button{display:flex;align-items:center;gap:11px;width:100%;padding:7px 8px;border-radius:7px;transition:background .15s;text-align:left}
.recent button:hover{background:#242940}
.rsprite{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
  background:#20253A;border-radius:7px;border:1px solid #2C3248}
.rsprite img{width:90%;height:90%;object-fit:contain;image-rendering:pixelated}
.rsprite .cno{font-family:'Space Mono',monospace;font-size:10px;color:#4A5170}
.rname{flex:1;min-width:0}
.rname b{display:block;font-family:'Outfit',sans-serif;font-size:13.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname span{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--dim)}
.rwhen{font-size:11px;color:var(--dim);white-space:nowrap}
.rstar{color:var(--gold);font-size:11px}

/* footer */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.ghost{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:all .16s}
.ghost:hover{color:var(--text);border-color:#434A66}
.foot-note{font-size:11.5px;color:#5D6480;margin-left:auto;text-align:right}
.banner{background:#1E2233;border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:6px;padding:9px 14px;font-size:12.5px;color:var(--dim);margin-bottom:16px;line-height:1.45}
@media (max-width:620px){
  .strip{display:none}
  .count{flex:1 1 100%}
  .count-n,.count-sub{text-align:left}
  .searchwrap{flex:1 1 100%;max-width:none;order:9}
  .foot-note{margin-left:0;text-align:left;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* The collection lives in two physical binders. Each one reads like a book: its first
   page sits alone facing the inside cover, then pages pair up, and a trailing odd page
   sits alone on the left. Openings are precomputed so both binders stay in step. */
const BINDERS = [
  { n: 1, word: "One", a: 1, b: 60, accent: "#D2544B", kind: "Poké Ball" },
  { n: 2, word: "Two", a: 61, b: PAGES, accent: "#3F72C9", kind: "Great Ball" },
];
const VIEWS = [];
for (const bd of BINDERS) {
  VIEWS.push({ pages: [bd.a], bd, cover: true });
  for (let p = bd.a + 1; p <= bd.b; p += 2)
    VIEWS.push({ pages: [p, p + 1].filter(x => x <= bd.b), bd, cover: false });
}
const PAGEVIEW = {};
VIEWS.forEach((v, i) => v.pages.forEach(p => { PAGEVIEW[p] = i; }));
const viewOf = p => PAGEVIEW[p] || 0;
const pagesOfView = v => VIEWS[v].pages;
const binderOf = p => VIEWS[viewOf(p)].bd;
const LASTVIEW = VIEWS.length - 1;

function binderCount(bd) {
  let have = 0, total = 0;
  for (let p = bd.a; p <= bd.b; p++) { const c = pageCount(p); have += c.have; total += c.total; }
  return { have, total };
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

let HOST = null, HOSTI = 0, resolved = false, spriteFails = 0;

function probeSprites() {
  let i = 0;
  const next = () => {
    if (i >= HOSTS.length) { resolved = true; renderAll(); return; }
    const h = HOSTS[i], img = new Image();
    img.onload = () => { HOST = h; HOSTI = i; resolved = true; renderAll(); };
    img.onerror = () => { i++; next(); };
    img.src = h.s(25);
  };
  next();
}

/* a sprite that fails retries the other hosts, then bows out; the slot's number is
   always drawn underneath, so a cell is never invisible either way */
document.addEventListener("load", e => {
  const el = e.target;
  if (el.tagName === "IMG" && el.classList.contains("cardart")) el.classList.add("in");
}, true);

document.addEventListener("error", e => {
  const el = e.target;
  if (el.tagName === "IMG" && el.dataset.card) {
    const pk = el.closest(".pocket");
    if (pk) pk.classList.remove("hascard");
    el.remove();
    return;
  }
  if (el.tagName !== "IMG" || !el.dataset.sp) return;
  const d = +el.dataset.sp;
  const tries = (+el.dataset.try || 0) + 1;
  const big = el.classList.contains("art");
  if (tries < HOSTS.length) {
    const h = HOSTS[(HOSTI + tries) % HOSTS.length];
    el.dataset.try = tries;
    el.src = big ? h.b(d) : h.s(d);
    return;
  }
  if (big) {
    const span = document.createElement("span");
    span.className = "art glyph";
    span.textContent = pad(d);
    el.replaceWith(span);
  } else {
    el.style.display = "none";
    spriteFails++;
    updateDiag();
  }
}, true);

/* ---------------- card galleries ---------------- */
/* The TCG API is community-run and occasionally flaky, so every request retries with
   backoff and every gallery is cached locally — a Pokémon is fetched once, ever. */
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* The card database goes down often enough that one or two retries isn't enough.
   Five attempts on a rising delay with jitter, so a burst of 500s doesn't sink a lookup. */
async function apiGet(url, tries = 5) {
  let last = "";
  for (let i = 1; i <= tries; i++) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
      last = "HTTP " + res.status;
      if (res.status < 500 && res.status !== 429) break;   // a real refusal, not a wobble
    } catch (e) { last = e.message || e.name; }
    if (i < tries) await sleep(500 * Math.pow(1.8, i - 1) + Math.random() * 300);
  }
  throw new Error(last || "no response");
}

async function readGallery(dex) {
  try {
    const raw = await store.get(GALKEY(dex));
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (Array.isArray(p)) return { list: p, t: 0 };        // written before caching kept dates
    if (p && Array.isArray(p.c)) return { list: p.c, t: p.t || 0 };
    return null;
  } catch (e) { return null; }
}

async function writeGallery(dex, list) {
  let index = [];
  try { index = JSON.parse((await store.get(GALINDEX)) || "[]"); } catch (e) {}
  index = index.filter(x => x !== dex);
  index.push(dex);
  while (index.length > GALMAX) {
    const drop = index.shift();
    try {
      if (window.storage) await window.storage.delete(GALKEY(drop));
      else localStorage.removeItem(GALKEY(drop));
    } catch (e) {}
  }
  try {
    await store.set(GALKEY(dex), JSON.stringify({ t: Date.now(), c: list }));
    await store.set(GALINDEX, JSON.stringify(index));
  } catch (e) { /* quota reached — that gallery simply refetches next time */ }
}

/* one card = [id, name, number, rarity, setName, releaseDate, image] */
/* run tasks a few at a time — parallel enough to be quick, not so many that the
   API starts refusing us */
async function pool(tasks, width) {
  const results = new Array(tasks.length);
  let next = 0;
  await Promise.all(Array.from({ length: Math.min(width, tasks.length) }, async () => {
    while (next < tasks.length) {
      const i = next++;
      try { results[i] = { ok: true, v: await tasks[i]() }; }
      catch (e) { results[i] = { ok: false }; }
    }
  }));
  return results;
}

/* Page one comes back first and is handed straight to the UI; the rest are fetched
   in parallel rather than one after another. */
/* One paged fetch used by both the card gallery and the set list.
   The API's pagination isn't perfectly stable: pages can overlap, which shows up as
   duplicate cards AND as missing ones — and since secret rares carry the highest
   numbers they sit in the last pages and vanish first. So: dedupe by card id, then
   check the unique count against the reported total and sweep again if any are short. */
async function fetchAllPages(base, map, onFirst) {
  const SIZE = 50, MAXPAGES = 20;
  const seen = Object.create(null);
  const out = [];
  const add = arr => {
    for (const c of arr || []) {
      if (!c || !c.id || seen[c.id]) continue;
      seen[c.id] = 1;
      out.push(map(c));
    }
  };

  const first = await apiGet(`${base}&page=1&pageSize=${SIZE}`);
  const total = first.totalCount || 0;
  add(first.data);
  const pages = Math.min(Math.ceil(total / SIZE), MAXPAGES);
  if (onFirst) onFirst(out.slice(), total, pages > 1);
  if (pages <= 1) return { list: out, total, missing: Math.max(0, total - out.length) };

  const rest = await pool(Array.from({ length: pages - 1 },
    (_, i) => () => apiGet(`${base}&page=${i + 2}&pageSize=${SIZE}`)), 4);
  let failed = 0;
  for (const r of rest) { if (r && r.ok) add(r.v.data); else failed++; }

  /* Overlapping pages leave gaps. Sweep the whole range again while each pass is still
     turning up new cards. */
  for (let pass = 0; !failed && out.length < total && pass < 3; pass++) {
    const before = out.length;
    const sweep = await pool(Array.from({ length: pages },
      (_, i) => () => apiGet(`${base}&page=${i + 1}&pageSize=${SIZE}`)), 3);
    for (const r of sweep) if (r && r.ok) add(r.v.data);
    if (out.length === before) break;             // no progress, stop asking
  }

  /* When the server's window drifts backwards, the final page starts before the true end
     and the last few cards are unreachable however often we sweep — and those are exactly
     the secret rares. So read past the calculated end until a page comes back empty. */
  for (let extra = 1; !failed && out.length < total && extra <= 3; extra++) {
    const page = pages + extra;
    if (page > MAXPAGES) break;
    let r;
    try { r = await apiGet(`${base}&page=${page}&pageSize=${SIZE}`); }
    catch (e) { break; }
    const rows = r.data || [];
    if (!rows.length) break;
    add(rows);
  }
  return { list: out, total, missing: Math.max(0, total - out.length) };
}

async function fetchGallery(dex, onFirst) {
  const base = `${API}?q=nationalPokedexNumbers:${dex}&select=id,name,number,rarity,set,images`;
  const map = c => [c.id, c.name, c.number, c.rarity || "", (c.set && c.set.name) || "",
                    (c.set && c.set.releaseDate) || "", (c.images && c.images.small) || ""];
  const r = await fetchAllPages(base, map, onFirst);
  return { list: r.list, partial: r.missing };
}

/* ---------------- sets ---------------- */
async function loadSets(force) {
  if (S.sets && !force) return;
  S.setsBusy = true; S.setsErr = null;
  if (S.tab === "sets") renderView();
  try {
    if (!force) {
      const raw = await store.get(SETSKEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && Array.isArray(p.c) && Date.now() - (p.t || 0) < SETSTTL) {
          S.sets = p.c; S.setsBusy = false;
          if (S.tab === "sets") renderView();
          return;
        }
      }
    }
    const json = await apiGet(`${API.replace("/cards", "/sets")}?orderBy=-releaseDate`);
    /* one entry = [id, name, series, releaseDate, total, logo] */
    S.sets = (json.data || []).map(x => [x.id, x.name, x.series || "", x.releaseDate || "",
                                         x.total || x.printedTotal || 0,
                                         (x.images && x.images.logo) || ""]);
    S.setsBusy = false;
    try { await store.set(SETSKEY, JSON.stringify({ t: Date.now(), c: S.sets })); } catch (e) {}
  } catch (err) {
    try {
      const raw = await store.get(SETSKEY);          // stale beats nothing
      const p = raw && JSON.parse(raw);
      if (p && Array.isArray(p.c)) { S.sets = p.c; S.setsErr = null; }
      else S.setsErr = err.message;
    } catch (e) { S.setsErr = err.message; }
    S.setsBusy = false;
  }
  if (S.tab === "sets") renderView();
}

async function loadSetCards(id, force) {
  S.openSet = id; S.setCards = null; S.setCardsErr = null; S.setCardsBusy = true; S.setMissing = 0;
  renderView();
  try {
    if (!force) {
      const raw = await store.get(SETKEY(id));
      if (raw) {
        const p = JSON.parse(raw);
        if (p && Array.isArray(p.c)) {
          S.setCards = p.c.slice().sort(byCardNumber); S.setCardsBusy = false;
          if (S.openSet === id) renderView();
          return;
        }
      }
    }
    /* no orderBy — the API's sort makes its paging less stable, and we sort locally anyway */
    const base = `${API}?q=set.id:${id}&select=id,name,number,rarity,images`;
    const map = c => [c.id, c.name, c.number, c.rarity || "", (c.images && c.images.small) || ""];
    const r = await fetchAllPages(base, map, (page1) => {
      if (S.openSet === id) {
        S.setCards = page1.sort(byCardNumber); S.setCardsBusy = false; renderView();
      }
    });
    if (S.openSet !== id) return;
    S.setCards = r.list.sort(byCardNumber);
    S.setMissing = r.missing;
    S.setCardsBusy = false;
    renderView();
    if (!r.missing) {
      try {
        await store.set(SETKEY(id), JSON.stringify({ t: Date.now(), c: r.list }));
        let idx = [];
        try { idx = JSON.parse((await store.get(SETINDEX)) || "[]"); } catch (e) {}
        if (!idx.includes(id)) { idx.push(id); await store.set(SETINDEX, JSON.stringify(idx)); }
      } catch (e) {}
    }
  } catch (err) {
    if (S.openSet !== id) return;
    S.setCardsErr = err.message; S.setCardsBusy = false;
    renderView();
  }
}

/* Card numbers are text in the API, so "10" sorts before "2" and secret rares scatter.
   Plain numbers come first in true numeric order — which puts secret rares, numbered
   above the set total, exactly where they belong — then lettered subsets like TG or GG. */
function cardNumKey(n) {
  const t = String(n == null ? "" : n).trim();
  const m = /^([A-Za-z]*)(\d+)(.*)$/.exec(t);
  if (!m) return [2, t.toUpperCase(), 0, ""];
  return [m[1] ? 1 : 0, m[1].toUpperCase(), parseInt(m[2], 10), m[3].toUpperCase()];
}
function byCardNumber(a, b) {
  const ka = cardNumKey(a[2]), kb = cardNumKey(b[2]);
  for (let i = 0; i < 4; i++) if (ka[i] !== kb[i]) return ka[i] < kb[i] ? -1 : 1;
  return 0;
}
const isChase = r => /secret|rainbow|hyper|illustration|ultra|special|gold|shiny|radiant|amazing/i.test(r || "");

function dedupeById(list) {
  const seen = Object.create(null), out = [];
  for (const c of list || []) { if (c && !seen[c[0]]) { seen[c[0]] = 1; out.push(c); } }
  return out;
}

/* which card ids are sitting in the binder right now */
function ownedCardIds() {
  const ids = {};
  for (const k in S.cards) { const d = +k; if (S.status[d-1] & HAVE) ids[S.cards[d].id] = d; }
  return ids;
}

const inflight = {};

/* Starts (or joins) the fetch for a Pokémon without touching the UI, so a hover can
   have the gallery ready before the click happens. */
function warmGallery(dex, force) {
  if (inflight[dex]) return inflight[dex];
  const job = (async () => {
    if (!force) {
      const cached = await readGallery(dex);
      if (cached && cached.list.length && Date.now() - cached.t < GALTTL) {
        return { list: cached.list, partial: 0, t: cached.t };
      }
    }
    const r = await fetchGallery(dex, (page1, total, more) => {
      if (S.pick === dex && S.galBusy && !S.galQ) {   // show page one while the rest arrive
        S.gal = page1; S.galBusy = false; S.galMore = more; S.galAge = Date.now();
        renderModal();
      }
    });
    if (!r.partial) writeGallery(dex, r.list);
    return { ...r, t: Date.now() };
  })();
  inflight[dex] = job;
  job.catch(() => {}).then(() => { delete inflight[dex]; });
  return job;
}

function prefetchGallery(dex) {
  if (inflight[dex] || S.galWarmed[dex]) return;
  S.galWarmed[dex] = 1;
  warmGallery(dex).catch(() => { delete S.galWarmed[dex]; });
}

async function openPicker(dex, force) {
  S.pick = dex; S.gal = null; S.galErr = null; S.galQ = "";
  S.galBusy = true; S.galPartial = 0; S.galAge = 0; S.galStale = false;
  renderModal();

  const cached = await readGallery(dex);
  try {
    const r = await warmGallery(dex, force);   // joins a hover-started fetch if one is running
    if (S.pick !== dex) return;
    S.gal = r.list; S.galPartial = r.partial || 0; S.galAge = r.t; S.galBusy = false; S.galMore = false;
    renderModal();
  } catch (err) {
    if (S.pick !== dex) return;
    if (cached && cached.list.length) {      // stale beats nothing when the API is down
      S.gal = cached.list; S.galAge = cached.t; S.galStale = true; S.galBusy = false;
    } else {
      S.galErr = err.message; S.galBusy = false;
    }
    S.galMore = false;
    renderModal();
  }
}

async function clearGalleryCache() {
  const drop = async k => {
    try {
      if (window.storage) await window.storage.delete(k);
      else localStorage.removeItem(k);
    } catch (e) {}
  };
  let n = 0;
  let gal = [];
  try { gal = JSON.parse((await store.get(GALINDEX)) || "[]"); } catch (e) {}
  for (const d of gal) { await drop(GALKEY(d)); n++; }
  try { await store.set(GALINDEX, "[]"); } catch (e) {}

  let sets = [];
  try { sets = JSON.parse((await store.get(SETINDEX)) || "[]"); } catch (e) {}
  for (const id of sets) { await drop(SETKEY(id)); n++; }
  try { await store.set(SETINDEX, "[]"); } catch (e) {}

  await drop(SETSKEY);                 // the set list itself, so new releases show up
  S.sets = null; S.setCards = null; S.galWarmed = {};
  return n;
}

function chooseCard(dex, id) {
  const c = (S.gal || []).find(x => x[0] === id);
  if (!c) return;
  const prev = S.cards[dex] || {};
  S.cards[dex] = { id: c[0], n: c[1], num: c[2], r: c[3], set: c[4], date: c[5], img: c[6],
                   cond: prev.cond || "", price: prev.price || "", acq: prev.acq || "", note: prev.note || "" };
  if (!(S.status[dex-1] & HAVE)) applyOpt(dex, "own"); else queueSave();
  S.pick = null; S.regallery = false;        // straight into the binder, no detour
  renderModal(); refreshCard(dex); updateHeader(); updateBinderMeta();
  const el = document.querySelector(`.pocket[data-d="${dex}"]`);
  if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1700); }
}

function clearCard(dex) {
  delete S.cards[dex];
  queueSave();
  renderModal();
  refreshCard(dex);          // pocket falls back to the sprite
  updateHeader(); updateBinderMeta();
}

/* ---------------- state ---------------- */

  status: [...SEED].map(Number),
  log: [],
  tab: "binder", page: 1,
  gen: -1, type: -1, filter: "all", q: "", sel: -1,
  pop: null, storageOk: true, confirmReset: false,
  cards: JSON.parse(JSON.stringify(CARDSEED)),   // dex -> chosen printing + collector notes
  artMode: true,        // show the real card in the pocket rather than the sprite
  pick: null, regallery: false,   // dex whose picker is open
  gal: null, galErr: null, galBusy: false, galQ: "", galSort: "old", galPartial: 0,
  galAge: 0, galStale: false, clearedCache: 0, galMore: false, galWarmed: {},
  sets: null, setsBusy: false, setsErr: null, setsQ: "",
  setOwned: {},         // card id -> 1; deliberately kept out of the dex totals
  setMissing: 0,
  openSet: null, setCards: null, setCardsBusy: false, setCardsErr: null,
};

const store = {
  async get(k) {
    if (window.storage) { const r = await window.storage.get(k); return r && r.value; }
    return localStorage.getItem(k);
  },
  async set(k, v) {
    if (window.storage) return window.storage.set(k, v);
    localStorage.setItem(k, v);
  },
};

let saveTimer = null;
function queueSave() {
  flag("on", "saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await store.set(KEY, S.status.join(""));
      await store.set(LOGKEY, JSON.stringify(S.log));
      await store.set(CARDKEY, JSON.stringify(S.cards));
      await store.set(PREFKEY, JSON.stringify({ artMode: S.artMode }));
      await store.set(SETOWNKEY, JSON.stringify(S.setOwned));
      S.storageOk = true;
      flag("on", "saved");
      setTimeout(() => flag("", ""), 1600);
    } catch (e) {
      S.storageOk = false;
      flag("err", "not saved");
      renderFoot();
    }
  }, 500);
}
function flag(cls, text) {
  const el = document.getElementById("save");
  if (el) { el.className = "save " + cls; el.textContent = text; }
}

async function boot() {
  try {
    const v = await store.get(KEY);
    if (typeof v === "string" && v.length === TOTAL) S.status = [...v].map(Number);
  } catch (e) {}
  try {
    const l = await store.get(LOGKEY);
    if (l) { const p = JSON.parse(l); if (Array.isArray(p)) S.log = p; }
  } catch (e) {}
  try {
    const c = await store.get(CARDKEY);
    if (c) { const p = JSON.parse(c); if (p && typeof p === "object") S.cards = p; }
  } catch (e) {}
  try {
    const so = await store.get(SETOWNKEY);
    if (so) { const p = JSON.parse(so); if (p && typeof p === "object") S.setOwned = p; }
  } catch (e) {}
  try {
    const pf = await store.get(PREFKEY);
    if (pf) { const p = JSON.parse(pf); if (p && typeof p.artMode === "boolean") S.artMode = p.artMode; }
  } catch (e) {}
  renderAll();
  probeSprites();
}

/* ---------------- derived ---------------- */
function derive() {
  const st = S.status;
  const owned = st.filter(v => v & HAVE).length;
  const special = st.filter(v => v & SPECIAL).length;
  const hunting = [];
  for (let d = 1; d <= TOTAL; d++) if ((st[d-1] & HUNT) && !(st[d-1] & HAVE)) hunting.push(d);
  const byGen = GENS.map(([n,a,b]) => {
    let have = 0; for (let d = a; d <= b; d++) if (st[d-1] & HAVE) have++;
    return { n, have, total: b - a + 1 };
  });
  const byType = TNAME.map((n,i) => ({ n, c: TCOL[i], have: 0, total: 0 }));
  for (let d = 1; d <= TOTAL; d++)
    for (const t of typesOf(d)) { byType[t].total++; if (st[d-1] & HAVE) byType[t].have++; }
  const pages = [];
  for (let p = 1; p <= PAGES; p++) {
    let have = 0, total = 0;
    for (let s = 0; s < PER; s++) {
      const d = (p-1)*PER + s + 1; if (d > TOTAL) break;
      total++; if (st[d-1] & HAVE) have++;
    }
    pages.push({ page: p, have, total });
  }
  let run = 0, best = 0, end = 0, grun = 0, gap = 0, gapEnd = 0;
  for (let d = 1; d <= TOTAL; d++) {
    if (st[d-1] & HAVE) { run++; if (run > best) { best = run; end = d; } grun = 0; }
    else { run = 0; grun++; if (grun > gap) { gap = grun; gapEnd = d; } }
  }

  let dual = 0;
  for (let d = 1; d <= TOTAL; d++) if ((st[d-1] & HAVE) && typesOf(d).length > 1) dual++;
  const squad = (list) => ({ have: list.filter(d => st[d-1] & HAVE).length, total: list.length });
  const legends = []; const mythics = [];
  for (let d = 1; d <= TOTAL; d++) { if (isLegend(d)) legends.push(d); if (isMythic(d)) mythics.push(d); }
  const squads = [
    { n: "Starters", ...squad(STARTERS) },
    { n: "Eeveelutions", ...squad(EEVEE) },
    { n: "Legendaries", ...squad(legends) },
    { n: "Mythicals", ...squad(mythics) },
  ];

  return { owned, special, hunting, byGen, byType, pages, best, end, gap, gapEnd, dual, squads };
}

function pageCount(p) {
  let have = 0, total = 0;
  for (let s = 0; s < PER; s++) {
    const d = (p-1)*PER + s + 1; if (d > TOTAL) break;
    total++; if (S.status[d-1] & HAVE) have++;
  }
  return { have, total };
}

function relTime(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) { const h = Math.round(s/3600); return h + (h === 1 ? " hour ago" : " hours ago"); }
  const d = Math.round(s/86400);
  if (d < 30) return d + (d === 1 ? " day ago" : " days ago");
  return new Date(t).toLocaleDateString();
}

function cell(d) {

  const cls = "cell" + (v & HAVE ? " have" : "") + (v & SPECIAL ? " special" : "")
    + ((v & HUNT) && !(v & HAVE) ? " wanted" : "");

/* ---------------- search ---------------- */
function suggest() {
  const q = S.q.trim().toLowerCase();
  if (!q) return [];
  const pre = [], mid = [], num = [];
  for (let d = 1; d <= TOTAL; d++) {
    const n = NAME[d-1].toLowerCase();
    if (n.startsWith(q)) pre.push(d);
    else if (n.includes(q)) mid.push(d);
    else if (String(d).startsWith(q) || pad(d).startsWith(q)) num.push(d);
  }
  return [...pre, ...mid, ...num].slice(0, 8);
}

function renderSug() {
  const box = document.getElementById("sug");
  if (!box) return;
  if (!S.q.trim()) { box.innerHTML = ""; return; }
  const list = suggest();
  if (!list.length) { box.innerHTML = `<div class="sug"><div class="sugnone">No Pokémon by that name or number.</div></div>`; return; }
  box.innerHTML = `<div class="sug" role="listbox">${list.map((d, i) => {
    const v = S.status[d-1];
    const pip = (v & SPECIAL) ? "pip special" : (v & HAVE) ? "pip have" : "pip";
    return `<button class="sugrow${i === S.sel ? " on" : ""}" data-jump="${d}" role="option" aria-selected="${i === S.sel}">
      ${HOST ? `<img data-sp="${d}" src="${HOST.s(d)}" alt="">` : ""}
      <span class="sn">${esc(NAME[d-1])}</span>
      <span class="sm">#${pad(d)} · page ${String(pageOf(d)).padStart(2,"0")}</span>
      <span class="${pip}"></span>
    </button>`;
  }).join("")}</div>`;
}

function jumpTo(d) {
  S.q = ""; S.sel = -1;
  S.page = pageOf(d);
  if (S.tab === "stats") S.tab = "binder";
  closePop();
  renderChrome(); renderView();
  const el = document.querySelector(`[data-d="${d}"]`);
  if (el) {
    el.classList.add("flash");
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    setTimeout(() => el.classList.remove("flash"), 1700);
  }
}

function popHTML(d) {

function openPop(dex, anchor) {
  const pop = document.getElementById("pop");
  S.pop = dex;
  pop.innerHTML = popHTML(dex);
  pop.style.visibility = "hidden";
  pop.classList.add("open");
  const a = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, m = 10;
  let left = a.left + a.width / 2 - w / 2;
  let top = a.bottom + gap, origin = "top center";
  if (top + h > innerHeight - m) { top = a.top - h - gap; origin = "bottom center"; }
  if (top < m) { top = Math.min(Math.max(m, a.top), innerHeight - h - m); origin = "center"; }
  pop.style.left = Math.max(m, Math.min(left, innerWidth - w - m)) + "px";
  pop.style.top = top + "px";
  pop.style.transformOrigin = origin;
  pop.style.visibility = "";
  pop.classList.remove("anim");
  void pop.offsetWidth;
  pop.classList.add("anim");
  const f = pop.querySelector(".popopt");
  if (f) f.focus({ preventScroll: true });
}

function closePop() {
  const pop = document.getElementById("pop");
  if (pop) { pop.className = ""; pop.innerHTML = ""; pop.removeAttribute("style"); }
  S.pop = null;
}

function applyOpt(dex, opt) {
  const i = dex - 1, before = S.status[i];
  let v = before;
  if (opt === "own") v = (v | HAVE) & ~SPECIAL;
  else if (opt === "special") v = v | HAVE | SPECIAL;
  else if (opt === "off") { v = v & ~(HAVE | SPECIAL); delete S.cards[dex]; }
  else if (opt === "hunt") v = (v & HUNT) ? v & ~HUNT : v | HUNT;
  S.status[i] = v;

  const wasOwned = !!(before & HAVE), nowOwned = !!(v & HAVE);
  if (!wasOwned && nowOwned) {
    S.log = S.log.filter(e => e[0] !== dex);
    S.log.push([dex, Date.now()]);
    if (S.log.length > 60) S.log = S.log.slice(-60);
  } else if (wasOwned && !nowOwned) {
    S.log = S.log.filter(e => e[0] !== dex);
  }
  queueSave();
}

/* ---------------- card picker ---------------- */

  list = [...list].sort((a, b) => S.galSort === "old"
    ? (a[5] || "").localeCompare(b[5] || "")
    : (b[5] || "").localeCompare(a[5] || ""));

}

function renderModal() {
  const host = document.getElementById("modal");
  if (S.pick === null) { host.className = ""; host.innerHTML = ""; return; }

  const showDetail = card && !S.regallery;   // reached from the info button, not from picking

    body = detailHTML(dex, card);
  } else if (S.galBusy) {
    body = `<div class="galnote"><span class="spin"></span>Looking up every English printing…</div>`;
  } else if (S.galErr) {

    const list = galFiltered();

      </div>
      ${S.galStale ? `<div class="galpartial">The database is down, so this is the list from

        <button class="ghost" data-act="refreshgal">Try again</button></div>` : ""}
      ${S.galPartial > 0 ? `<div class="galpartial">The database dropped out partway — showing the

          const y = (c[5] || "").slice(0,4);

        <button class="mclose" data-act="closemodal" aria-label="Close">×</button>
      </div>
      <div class="mbody">${body}</div>

/* ---------------- surgical updates ---------------- */
function refreshCard(d) {
  document.querySelectorAll(`[data-d="${d}"]`).forEach(el => {
    el.outerHTML = el.classList.contains("pocket") ? pocket(d) : cell(d);
  });
}

function updateHeader() {
  const owned = S.status.filter(v => v & HAVE).length;
  const special = S.status.filter(v => v & SPECIAL).length;
  let hunting = 0;
  for (let d = 1; d <= TOTAL; d++) if ((S.status[d-1] & HUNT) && !(S.status[d-1] & HAVE)) hunting++;
  const pct = Math.round(owned / TOTAL * 100);
  const n = document.getElementById("cnt");
  if (n) n.textContent = owned;
  const b = document.getElementById("fill");
  if (b) b.style.width = pct + "%";
  const p = document.getElementById("pika");
  if (p) p.style.left = Math.min(Math.max(pct, 2.5), 97.5) + "%";
  const s = document.getElementById("csub");
  if (s) s.textContent = `${pct}% complete · ${special} special · ${hunting} on the hunt`;
}

function updateBinderMeta() {
  if (S.tab !== "binder") return;
  const pgs = pagesOfView(viewOf(S.page));
  let have = 0, total = 0;
  for (const p of pgs) {
    const c = pageCount(p);
    have += c.have; total += c.total;
    const bar = document.querySelector(`.sbar[data-page="${p}"]`);
    if (bar) {
      bar.style.setProperty("--fill", (c.have/c.total*100) + "%");
      bar.classList.toggle("full", c.have === c.total);
    }
    const head = document.querySelector(`.sheet[data-p="${p}"] .side span`);
    if (head) {
      const st = (p-1)*PER + 1, en = Math.min(st + PER - 1, TOTAL);
      head.textContent = `#${pad(st)} – #${pad(en)} · ${c.have}/${c.total}`;
    }
  }
  const r = document.getElementById("prange");
  if (r) {
    const first = pgs[0], last = pgs[pgs.length-1];
    r.textContent = `Binder ${binderOf(first).word} · #${pad((first-1)*PER + 1)} – #${pad(Math.min(last*PER, TOTAL))} · ${have}/${total} filled`;
  }
  const cov = document.querySelector("[data-cover]");
  if (cov) {
    const bd = BINDERS[+cov.dataset.cover - 1];
    const c = binderCount(bd);
    const bar = cov.querySelector(".cover-bar i");
    if (bar) bar.style.width = (c.total ? c.have / c.total * 100 : 0) + "%";
    const cnt = cov.querySelector(".cover-count");
    if (cnt) cnt.innerHTML = `<b>${c.have}</b> of ${c.total} filled`;
  }
}

  const D = derive();
  const v = viewOf(S.page);
  const V = VIEWS[v];
  const pgs = V.pages, bd = V.bd;
  const first = pgs[0], last = pgs[pgs.length-1];
  const start = (first-1)*PER + 1, end = Math.min(last*PER, TOTAL);
  let have = 0, total = 0;
  for (const p of pgs) { const c = pageCount(p); have += c.have; total += c.total; }
  const label = pgs.length > 1
    ? `Pages ${String(first).padStart(2,"0")}–${String(last).padStart(2,"0")}`
    : `Page ${String(first).padStart(2,"0")}`;

  /* a binder's first page faces its cover; a trailing odd page has nothing facing it */
  const sheets = V.cover
    ? coverHTML(bd) + sheetHTML(first)
    : pgs.map(sheetHTML).join("") + (pgs.length === 1 ? endHTML(bd) : "");

  const atStart = v === 0, atEnd = v === LASTVIEW;
  return `
  <div class="pagenav">
    <button class="arrow" data-act="prev" ${v===0?"disabled":""} aria-label="Previous page">&lsaquo;</button>
    <div class="pagemeta">
      <div class="pageno">${label}</div>
      <div class="pagerange" id="prange">Binder ${bd.word} · #${pad(start)} – #${pad(end)} · ${have}/${total} filled</div>
    </div>
    <button class="arrow" data-act="next" ${v===LASTVIEW?"disabled":""} aria-label="Next page">&rsaquo;</button>
  </div>
  <div class="strip">${D.pages.map(p =>
    `<button class="sbar${pgs.includes(p.page)?" on":""}${p.have===p.total?" full":""}${BINDERS.some(b=>b.n>1&&b.a===p.page)?" split":""}"
       data-page="${p.page}" style="--fill:${(p.have/p.total*100)}%"
       title="Binder ${binderOf(p.page).word} · page ${p.page} — ${p.have}/${p.total}" aria-label="Page ${p.page}"></button>`).join("")}</div>
  <div class="spread">
    <button class="flip left" data-act="prev" ${atStart ? "disabled" : ""} aria-label="Previous page">
      <span>&lsaquo;</span></button>
    <div class="sheets">${sheets}</div>
    <button class="flip right" data-act="next" ${atEnd ? "disabled" : ""} aria-label="Next page">
      <span>&rsaquo;</span></button>
  </div>`;
}

function wallList() {
  const q = S.q.trim().toLowerCase();
  const out = [];
  for (let d = 1; d <= TOTAL; d++) {
    const v = S.status[d-1];
    if (S.gen >= 0 && genOf(d) !== S.gen) continue;
    if (S.type >= 0 && !typesOf(d).includes(S.type)) continue;
    if (S.filter === "have" && !(v & HAVE)) continue;
    if (S.filter === "missing" && (v & HAVE)) continue;
    if (S.filter === "special" && !(v & SPECIAL)) continue;
    if (S.filter === "hunt" && !(v & HUNT)) continue;
    if (q && !NAME[d-1].toLowerCase().includes(q) && !String(d).includes(q)) continue;
    out.push(d);
  }
  return out;
}

/* wall paints in chunks so it never floods the browser with 1,025 image requests */
let wall = { list: [], drawn: 0, io: null, timer: null };

/* Rather than waiting for the scroll to reach the bottom, keep filling the grid in the
   background during idle frames. Staggering the batches is what keeps the sprite hosts
   happy; making them wait on the scroll position was never the point. */
function scheduleFill() {
  cancelFill();
  if (wall.drawn >= wall.list.length) return;
  const idle = window.requestIdleCallback || (cb => setTimeout(cb, 70));
  wall.timer = idle(() => { wall.timer = null; drawChunk(); scheduleFill(); });
}
function cancelFill() {
  if (wall.timer == null) return;
  if (window.cancelIdleCallback) { try { cancelIdleCallback(wall.timer); } catch (e) {} }
  clearTimeout(wall.timer);
  wall.timer = null;
}

function paintWall() {
  const host = document.getElementById("wall");
  if (!host) return;
  cancelFill();
  wall.list = wallList();
  wall.drawn = 0;
  host.innerHTML = "";
  drawChunk();
  scheduleFill();
  if (wall.io) wall.io.disconnect();
  const sent = document.getElementById("sentinel");
  if (!sent) return;
  wall.io = new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting)) { drawChunk(); scheduleFill(); }
  }, { rootMargin: "1600px" });
  wall.io.observe(sent);
}
function updateDiag() {
  const el = document.getElementById("diag");
  if (!el) return;
  el.textContent = ` · ${wall.drawn} slots drawn` + (spriteFails ? ` · ${spriteFails} sprites unavailable` : "");
}

function drawChunk() {
  const host = document.getElementById("wall");
  const sent = document.getElementById("sentinel");
  if (!host) return;
  const end = Math.min(wall.drawn + CHUNK, wall.list.length);
  if (end > wall.drawn) {
    host.insertAdjacentHTML("beforeend", wall.list.slice(wall.drawn, end).map(cell).join(""));
    wall.drawn = end;
  }
  updateDiag();
  if (sent) {
    const done = wall.drawn >= wall.list.length;
    sent.style.display = done ? "none" : "";
    if (done) { if (wall.io) wall.io.disconnect(); cancelFill(); }
  }
}

/* These read the printings you've actually picked, so they describe identified
   cards rather than the whole binder. */
function cardStats() {
  const list = [];
  for (const k in S.cards) { const d = +k; if (S.status[d-1] & HAVE) list.push(S.cards[d]); }
  const byYear = {}, bySet = {}, byRarity = {};
  let oldest = null, newest = null;
  for (const c of list) {
    const y = (c.date || "").slice(0, 4);
    if (y) {
      byYear[y] = (byYear[y] || 0) + 1;
      if (!oldest || c.date < oldest.date) oldest = c;
      if (!newest || c.date > newest.date) newest = c;
    }
    if (c.set) bySet[c.set] = (bySet[c.set] || 0) + 1;
    const r = c.r || "Unlisted";
    byRarity[r] = (byRarity[r] || 0) + 1;
  }
  const rank = o => Object.entries(o).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const chase = list.filter(c => /secret|rainbow|hyper|illustration|ultra|special|gold|shiny/i.test(c.r || "")).length;
  const years = Object.keys(byYear).sort();
  return { n: list.length, byYear, years, oldest, newest, chase,
           sets: rank(bySet), rarities: rank(byRarity), topYear: rank(byYear)[0] || null };
}

  const v = Math.max(0, Math.min(LASTVIEW, viewOf(S.page) + dir));
  S.page = pagesOfView(v)[0];
  renderView();
}

      ${S.clearedCache ? `Cleared ${S.clearedCache} — reopen any card` : "Check for new sets"}</button>
    <button class="ghost" data-act="export">Download spreadsheet</button>
    <button class="ghost" data-act="reset" style="${S.confirmReset?"color:var(--gold);border-color:var(--gold)":""}">
      ${S.confirmReset ? "Tap again to wipe your changes" : "Reset to original"}</button>
    <span class="foot-note">${S.storageOk ? "Changes save automatically in this browser." : "Can't save here — download the spreadsheet to keep your changes."}</span>
  </footer>`;
}

function renderAll() { renderChrome(); renderView(); renderFoot(); }

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  // modal first — it sits above everything
  const mact = e.target.closest("#modal [data-act]");
  if (mact) {
    const a = mact.dataset.act;
    if (a === "closemodal") { S.pick = null; S.regallery = false; renderModal(); }
    else if (a === "galsort") { S.galSort = S.galSort === "old" ? "new" : "old"; renderModal(); }
    else if (a === "regallery") { S.regallery = true; renderModal(); if (!S.gal) openPicker(S.pick); }
    else if (a === "clearcard") { const d = S.pick; S.pick = null; S.regallery = false; clearCard(d); }
    else if (a === "retrygal" || a === "refreshgal") { openPicker(S.pick, true); }
    return;
  }
  const info = e.target.closest("[data-info]");
  if (info) {
    e.preventDefault(); e.stopPropagation();
    closePop();
    S.pick = +info.dataset.info; S.regallery = false;
    renderModal();
    return;
  }
  const pickBtn = e.target.closest("[data-pick]");
  if (pickBtn) { S.regallery = false; chooseCard(S.pick, pickBtn.dataset.pick); return; }
  if (e.target.closest("#modal")) return;

  const opt = e.target.closest("[data-opt]");
  if (opt) {
    const d = S.pop;
    applyOpt(d, opt.dataset.opt);
    closePop();
    refreshCard(d); updateHeader(); updateBinderMeta();
    if (S.tab === "stats") renderView();
    return;
  }
  const pickAct = e.target.closest('#pop [data-act="pickcard"]');
  if (pickAct) { const d = S.pop; closePop(); S.regallery = true; openPicker(d); return; }
  const dropAct = e.target.closest('#pop [data-act="dropcard"]');
  if (dropAct) { const d = S.pop; closePop(); clearCard(d); return; }
  if (e.target.closest("#pop")) return;

  const el = e.target.closest("[data-d],[data-tab],[data-page],[data-gen],[data-type],[data-filter],[data-act],[data-jump],[data-set],[data-own]");
  const wasOpen = S.pop;
  if (wasOpen !== null) closePop();
  if (!el) return;
  const ds = el.dataset;

  if (ds.jump) { jumpTo(+ds.jump); return; }
  if (ds.d) { if (wasOpen !== +ds.d) openPop(+ds.d, el); return; }
  if (ds.tab) { S.tab = ds.tab; if (ds.tab !== "sets") S.openSet = null;
                renderChrome(); renderView(); return; }
  if (ds.page) { S.page = +ds.page; S.tab = "binder"; renderChrome(); renderView(); return; }
  if (ds.gen !== undefined) { S.gen = S.gen === +ds.gen ? -1 : +ds.gen; renderView(); return; }
  if (ds.type !== undefined) { S.type = S.type === +ds.type ? -1 : +ds.type; renderView(); return; }
  if (ds.filter) { S.filter = ds.filter; renderView(); return; }
  if (ds.own) {
    /* set collecting only — deliberately does not touch S.status or any dex total */
    if (S.setOwned[ds.own]) delete S.setOwned[ds.own]; else S.setOwned[ds.own] = 1;
    queueSave();
    renderView();
    return;
  }
  if (ds.set) { loadSetCards(ds.set); return; }
  if (ds.act === "closeset") { S.openSet = null; S.setCards = null; renderView(); return; }
  if (ds.act === "reloadsets") { S.sets = null; loadSets(true); return; }
  if (ds.act === "reloadset") { loadSetCards(S.openSet, true); return; }
  if (ds.act === "prev") { stepView(-1); return; }
  if (ds.act === "next") { stepView(1); return; }
  if (ds.act === "export") { exportSheet(); return; }
  if (ds.act === "artmode") { S.artMode = !S.artMode; queueSave(); renderView(); renderFoot(); return; }
  if (ds.act === "clearcache") {
    clearGalleryCache().then(n => {
      S.clearedCache = n || -1;
      renderFoot();
      setTimeout(() => { S.clearedCache = 0; renderFoot(); }, 5000);
    });
    return;
  }
  if (ds.act === "reset") {
    if (S.confirmReset) {
      S.status = [...SEED].map(Number); S.log = []; S.confirmReset = false; queueSave(); renderAll();
    } else {
      S.confirmReset = true; renderFoot();
      setTimeout(() => { if (S.confirmReset) { S.confirmReset = false; renderFoot(); } }, 4000);
    }
    return;
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "galq") { S.galQ = e.target.value; renderModal(); return; }
  if (e.target.id === "setsq") {
    S.setsQ = e.target.value; renderView();
    const el = document.getElementById("setsq");
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return;
  }
  const fld = e.target.closest("[data-field]");
  if (fld && S.pick !== null && S.cards[S.pick]) {
    S.cards[S.pick][fld.dataset.field] = e.target.value;
    queueSave();
    return;
  }
  if (e.target.id !== "q") return;
  S.q = e.target.value; S.sel = -1;
  closePop();
  renderSug();
  if (S.tab === "dex") renderView();
});

document.addEventListener("keydown", e => {
  if (e.target.id === "q") {
    const list = suggest();
    if (e.key === "ArrowDown") { e.preventDefault(); S.sel = Math.min(S.sel + 1, list.length - 1); renderSug(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); S.sel = Math.max(S.sel - 1, -1); renderSug(); }
    else if (e.key === "Enter") { const d = list[S.sel < 0 ? 0 : S.sel]; if (d) jumpTo(d); }
    else if (e.key === "Escape") { S.q = ""; S.sel = -1; renderSug(); if (S.tab === "dex") renderView(); }
    return;
  }
  if (e.key === "Escape" && S.pick !== null) { S.pick = null; S.regallery = false; renderModal(); return; }
  if (e.key === "Escape" && S.pop !== null) { closePop(); return; }
  if (S.tab !== "binder" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") stepView(-1);
  if (e.key === "ArrowRight") stepView(1);
});

/* Hovering a pocket for a moment starts its lookup, so by the time the menu is open
   the gallery is usually already in hand. Only fires once per Pokémon per session. */
let hoverTimer = null;
document.addEventListener("mouseover", e => {
  const pk = e.target.closest && e.target.closest(".pocket[data-d]");
  clearTimeout(hoverTimer);
  if (!pk) return;
  const d = +pk.dataset.d;
  hoverTimer = setTimeout(() => prefetchGallery(d), 280);
}, { passive: true });

addEventListener("scroll", () => { if (S.pop !== null && S.pick === null) closePop(); }, { passive: true });
addEventListener("resize", () => { if (S.pop !== null) closePop(); });

function exportSheet() {
  const rows = [["PokeDex #","Name","Page #","Slot #","Card Type","Special","Priority",
                 "Card ID","Card Name","Set","Set Year","Card Number","Rarity",
                 "Condition","Paid","Acquired","Notes"]];
  for (let d = 1; d <= TOTAL; d++) {
    const v = S.status[d-1], c = S.cards[d] || {};
    rows.push(["#" + pad(d), NAME[d-1], pageOf(d), ((d-1)%PER)+1,
      v & HAVE ? 1 : 0, v & SPECIAL ? "special" : "", v & HUNT ? "x" : "",
      c.id || "", c.n || "", c.set || "", (c.date || "").slice(0,4), c.num || "", c.r || "",
      c.cond || "", c.price || "", c.acq || "", c.note || ""]);
  }
  const csv = rows.map(r => r.map(c => {
    const s = String(c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Pokemon_Collection.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

boot();
</script>
</body>
</html>
